<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenowa AI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="utils.js"></script>
  <!-- Puter.js (Local) -->
  <script src="puter.js"></script>
</head>

<body>

  <div class="app-container">
    <!-- Sidebar for History -->
    <div id="history-sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">History</h2>
        <button id="close-sidebar-btn" class="icon-btn-small" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="history-list" class="history-list">
        <!-- History items will be injected here -->
      </div>

      <div class="sidebar-footer">
        <button id="settings-btn" class="settings-link-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          Settings
        </button>
      </div>
    </div>

    <!-- Main Chat Area -->
    <main class="chat-interface">
      <!-- Header (Minimal) -->
      <header class="chat-header">
        <div class="header-left">
          <button id="menu-btn" class="icon-btn" title="History">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand-area">
            <span class="brand-name">Kenowa 2.0</span>
            <img src="logo.png" alt="Logo" class="brand-logo">
          </div>
        </div>
        <div class="header-right">
          <button id="new-chat-btn" class="icon-btn" title="New Chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
        </div>
      </header>

      <div id="chat-container" class="chat-container">
        <!-- Scroll to Bottom Button -->
        <button id="scroll-bottom-btn" class="scroll-bottom-btn hidden" title="Scroll to bottom">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 13l5 5 5-5M7 6l5 5 5-5" />
          </svg>
        </button>
        <div id="welcome-screen" class="welcome-screen">
          <h1 class="greeting">Hi Nadeem, what should we dive into today?</h1>
        </div>
        <div id="messages-list" class="messages-list">
          <!-- Messages will appear here -->
        </div>
        <div id="typing-indicator" class="typing-indicator hidden"></div>

        <!-- Suggestions (Bottom Right) -->
        <div class="suggestions-container">
          <div class="suggestions-grid">
            <button class="suggestion-chip" id="chip-summarize">Summarize this page</button>
            <button class="suggestion-chip" id="chip-expand">Expand on this topic</button>
            <button class="suggestion-chip" id="chip-help">How can Kenowa help?</button>
          </div>
        </div>
      </div>

      <!-- Input Area (Floating Card) -->
      <div class="input-card-container">
        <div id="image-preview-container" class="image-preview-container hidden"></div>

        <div class="input-card">
          <textarea id="user-input" placeholder="Message Kenowa or @mention a tab" rows="1"></textarea>

          <div class="input-footer">
            <div class="left-controls">
              <button id="exam-mode-btn" class="icon-btn-small" title="Exam Mode">
                <span style="font-weight: bold; font-size: 0.9rem;">EX</span>
              </button>
              <button id="sq-btn" class="icon-btn-small" title="Solve Question (SQ)">
                <span style="font-weight: bold; font-size: 0.9rem;">SQ</span>
              </button>
              <button id="attach-btn" class="icon-btn-small" title="Attach Image">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48">
                  </path>
                </svg>
              </button>
              <select id="mode-selector" class="mode-selector">
                <option value="quick">⚡ Quick (Flash)</option>
                <option value="deep">🧠 Deep Think (Pro)</option>
                <option value="image">🎨 Image Gen</option>
              </select>
              <input type="file" id="file-input" multiple accept="image/*" hidden>
            </div>

            <div class="right-controls">
              <button id="mic-btn" class="icon-btn-small" title="Voice Input">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
              </button>
              <button id="send-btn" class="send-btn" title="Send">
                <span id="icon-send"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg></span>
                <span id="icon-stop" class="hidden"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <rect x="6" y="6" width="12" height="12"></rect>
                  </svg></span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Onboarding Modal -->
  <div id="onboarding-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Welcome to Kenowa AI!</h2>
        <p>Let's get to know you.</p>
      </div>
      <div class="modal-body">
        <label for="user-name-input">What's your name?</label>
        <input type="text" id="user-name-input" placeholder="Enter your name..." autocomplete="off">

        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
          <label for="api-key-input">Gemini API Key</label>
          <a href="help.html" target="_blank"
            style="font-size: 0.85rem; color: #7b68ee; text-decoration: none;">Help?</a>
        </div>
        <input type="password" id="api-key-input" placeholder="Paste your API Key here..." autocomplete="off">

        <p class="error-msg hidden" id="name-error">Please enter your name and API key.</p>
      </div>
      <div class="modal-footer">
        <button id="start-chat-btn" class="primary-btn">Start Chatting</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 15px; color: #666;">Manage your profile and API connection.</p>

        <label for="settings-name-input">Your Name</label>
        <input type="text" id="settings-name-input" placeholder="Your Name"
          style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">

        <label for="settings-provider-input">Active Provider</label>
        <select id="settings-provider-input"
          style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; background: var(--bg-dark); color: var(--text-main);">
          <option value="gemini">Google Gemini</option>
          <option value="openrouter">OpenRouter</option>
        </select>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <label for="settings-key-input">Gemini API Key</label>
          <a href="help.html" target="_blank"
            style="font-size: 0.85rem; color: #7b68ee; text-decoration: none;">Help?</a>
        </div>
        <input type="password" id="settings-key-input" placeholder="Paste Gemini Key"
          style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
          <label for="settings-openrouter-key-input">OpenRouter API Key</label>
        </div>
        <input type="password" id="settings-openrouter-key-input" placeholder="Paste OpenRouter Key"
          style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box;">

        <p style="font-size: 0.8rem; color: #999; margin-bottom: 20px;">Keys are stored locally.</p>

        <label for="settings-model-input">Default AI Model</label>
        <select id="settings-model-input"
          style="width: 100%; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box; background: var(--bg-dark); color: var(--text-main);">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Exp</option>
          <!-- OpenRouter Models -->
          <option value="google/gemini-2.0-flash-exp:free">OpenRouter: Gemini 2.0 Free</option>
          <option value="deepseek/deepseek-r1">OpenRouter: DeepSeek R1</option>
          <option value="openai/gpt-4o-mini">OpenRouter: GPT-4o Mini</option>
        </select>

        <button id="save-settings-btn" class="primary-btn" style="width: 100%; margin-bottom: 20px;">Save
          Changes</button>
        <hr style="border: none; border-top: 1px solid #eee; margin: 0 0 20px 0;">
        <button id="clear-data-btn" class="danger-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear All Data
        </button>
      </div>
      <div class="modal-footer">
        <button id="close-settings-btn" class="secondary-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>

</html>
